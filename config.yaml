# フィード通知の設定。
# 宛先 (MAIL_TO) と API キー (MAIL_APIKEY) はリポジトリに残さないよう環境変数から読みます。

mail:
  subject: "feed更新通知"
  from: "feed@resend.dev"

# 状態ファイル。いずれも 1 レコード 1 行の JSONL。
state_path: cache/fetched.jsonl
seen_path: cache/seen.jsonl

# 既読リンクの保持期間。長いほど取りこぼしに強いが、seen.jsonl も比例して大きくなる。
seen_retention: 720h # 30 日

# 新規購読フィードで初回に遡る期間。
new_subscription_lookback: 24h

# フィード間の待機時間。YouTube は連続アクセスで 404/500 を返すことがあるため空ける。
polite_delay: 2s

# フィード取得・メール送信の最大試行回数。
max_retry: 5

# この接頭辞で始まるリンクは通知しない。
exclude_prefixes:
  - "https://anond.hatelabo.jp"
  - "https://www.youtube.com/shorts/"

subscriptions:
  - title: "はてブ（テクノロジー）"
    url: "https://b.hatena.ne.jp/hotentry/it.rss"
  - title: "Zenn"
    url: "https://zenn.dev/feed"
  - title: "Publickey"
    url: "https://www.publickey1.jp/atom.xml"
  - title: "窓の杜"
    url: "https://forest.watch.impress.co.jp/data/rss/1.0/wf/feed.rdf"
  - title: "AI Watch"
    url: "https://ai.watch.impress.co.jp/data/rss/1.0/aiw/feed.rdf"
  - title: "ワンパンマン"
    url: "https://tonarinoyj.jp/rss/series/13932016480028984490"
